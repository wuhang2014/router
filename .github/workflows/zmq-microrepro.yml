name: zmq-sigsegv-microrepro (issue 571)

# v2: sweep POD copy sizes to find the size-class where gcc-15 (-march
# default x86-64-v3, Ubuntu 26.04) lowers a 8-aligned struct copy to
# ALIGNED vmovdqa stores -> fault on 16-aligned malloc memory.
# Mirrors zmq::command_t (64B in libzmq 4.3.4, align 8 because
# zeromq-src 0.2.6 drops HAVE_POSIX_MEMALIGN).

on:
  workflow_dispatch:
  push:
    branches: [repro/issue-571-zmq]

concurrency:
  group: zmq-micro-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: sweep ${{ matrix.cxx }} ${{ matrix.flags }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++, flags: "-O0" }
          - { cxx: g++, flags: "-O3" }
          - { cxx: g++, flags: "-O0 -mno-avx" }
          - { cxx: g++-13, flags: "-O0" }
    steps:
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++-13 binutils >/dev/null
          ${{ matrix.cxx }} --version | head -1
          echo | ${{ matrix.cxx }} -dM -E - ${{ matrix.flags }} | grep -cE "__AVX2__ 1" || true
      - name: Sweep sizes
        run: |
          cat > gen.sh <<'SH'
          #!/bin/bash
          # $1 = total struct size, $2 = extra compile flags, $3 = optional decl
          SZ=$1
          cat > r.cpp <<EOF
          #include <cstdio>
          #include <new>
          ${3}struct command_t {
              void *destination;
              int type;
              union args_t { void *p; unsigned long u; struct { int a, b; } h; } args;
              char pad[$((SZ - 40))];
          };
          struct chunk_t { command_t values[16]; chunk_t *prev; chunk_t *next; };
          __attribute__((noinline)) void write_back (chunk_t *c_, unsigned pos_, const command_t &v_)
          { c_->values[pos_] = v_; }
          int main () {
              printf ("  sizeof=%zu alignof=%zu\n", sizeof (command_t), alignof (command_t));
              command_t v {}; v.type = 3;
              for (int round = 0; round < 64; round++) {
                  chunk_t *c = new (std::nothrow) chunk_t;
                  if (!c) break;
                  write_back (c, (unsigned) (round % 16), v);
              }
              puts ("  run: done-no-fault");
              return 0;
          }
          EOF
          $CXX $2 -g r.cpp -o r 2>err.txt || { echo "  compile: $(head -1 err.txt)"; exit 0; }
          echo -n "  codegen: "
          objdump -d r | grep -A40 "_Z11write_back" | grep -oE "vmovdqa[a-z0-9]*|vmovdqu[a-z0-9]*|movdqa|movdqu|rep movsq|movaps" | sort | uniq -c | tr '\n' ' '
          echo
          ./r; ec=$?
          [ $ec -ne 139 ] || echo "  >>> SIGSEGV reproduced at size $SZ <<<"
          SH
          chmod +x gen.sh
          export CXX=${{ matrix.cxx }}
          for SZ in 40 48 56 64 72 80; do echo "== struct size $SZ:"; ./gen.sh $SZ "${{ matrix.flags }}" ""; done
      - name: alignas(64) variant at 64
        if: matrix.cxx == 'g++' && matrix.flags == '-O0'
        run: |
          export CXX=g++
          echo "== struct size 64 + alignas(64) on struct:"
          ./gen.sh 64 "-O0" "__attribute__((aligned(64))) "
          echo "== struct size 64 -march=x86-64 (v1):"
          ./gen.sh 64 "-O0 -march=x86-64" ""
