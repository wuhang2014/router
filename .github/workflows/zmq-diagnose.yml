name: zmq-sigsegv-diagnose (issue 571)

# Root-cause dig for vllm-project/router#571: capture the actual fault on
# ubuntu-26.04 via gdb (libzmq built -g -O0), upload the static libzmq.a
# built by gcc-15 for local disassembly. Prior run established: same image
# with CXX=g++-13 passes -> gcc-15 codegen is the trigger.

on:
  workflow_dispatch:
  push:
    branches: [repro/issue-571-zmq]

concurrency:
  group: zmq-diag-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gdb-backtrace:
    name: gdb backtrace on ubuntu-26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "full"
      CC_ENABLE_DEBUG_OUTPUT: "1"
      CFLAGS: "-g -O0 -fno-omit-frame-pointer"
      CXXFLAGS: "-g -O0 -fno-omit-frame-pointer"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler gdb
      - name: Build test binary
        run: |
          cargo test --features cpu,ready --lib --no-run > build.log 2>&1 || (tail -50 build.log; exit 1)
          grep -m4 "ctx.cpp\|socket_base.cpp" build.log || true
          g++ --version | head -1
      - name: Locate test binary
        id: bin
        run: |
          BIN=$(find target/debug/deps -maxdepth 1 -type f -name 'vllm_router_rs-*' -perm -111 | head -1)
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          echo "testing $BIN"
      - name: Raw run (confirm crash outside cargo)
        run: |
          ${{ steps.bin.outputs.bin }} --test-threads=1 abandoned_pushes_cancel_all_consumer_shards; ec=$?; echo "raw exit=$ec"; true
      - name: gdb
        if: always()
        run: |
          gdb -q -batch \
            -ex "set pagination off" \
            -ex "set print pretty on" \
            -ex run \
            -ex "echo \n=====SIGINFO=====\n" \
            -ex "p $_siginfo" \
            -ex "echo \n=====BACKTRACE=====\n" \
            -ex "bt 40" \
            -ex "echo \n=====BT-FULL-top=====\n" \
            -ex "bt full 8" \
            -ex "echo \n=====REGISTERS=====\n" \
            -ex "info registers" \
            -ex "echo \n=====CODE-AT-PC=====\n" \
            -ex "x/16i \$pc-24" \
            -ex "echo \n=====ALL-THREADS=====\n" \
            -ex "thread apply all bt 10" \
            --args ${{ steps.bin.outputs.bin }} --test-threads=1 abandoned_pushes_cancel_all_consumer_shards 2>&1 | tee gdb.log
          true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-gdb-2604
          path: |
            gdb.log
            build.log
          if-no-files-found: warn
      - name: Upload static libzmq.a (gcc-15 build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-libzmq-2604
          path: |
            target/debug/build/zmq-sys-*/out/**/*.a
          if-no-files-found: warn
