name: zmq-sigsegv-fixcheck (issue 571)

# Validate the compile-level fix on the FAILING image: define
# HAVE_POSIX_MEMALIGN for the vendored libzmq build so yqueue_t uses
# posix_memalign(64) for its chunks (matching command_t's aligned(64)).

on:
  workflow_dispatch:
  push:
    branches: [repro/issue-571-zmq]

concurrency:
  group: zmq-fix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix-have-posix-memalign:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      CFLAGS: "-DHAVE_POSIX_MEMALIGN=1"
      CXXFLAGS: "-DHAVE_POSIX_MEMALIGN=1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler
      - name: Run the 3 zmq tests (was SIGSEGV here without the define)
        run: |
          cargo test --features cpu,ready --lib -- --test-threads=1 \
            configured_event_sources_skip_unavailable_control_discovery \
            discovered_source_bindings_are_atomic_and_released_with_the_worker \
            abandoned_pushes_cancel_all_consumer_shards
      - name: Full unit lane
        run: cargo test --features cpu,ready --lib --bins -- --test-threads=1
